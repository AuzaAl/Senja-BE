services:
  senja_be:
    build:
      context: .
      dockerfile: Dockerfile
    image: senja-be:latest
    container_name: senja-be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host-specific values so the app talks to the compose services.
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      # Security: demo users (admin/editor/viewer) use password "password".
      RUN_SEEDER: "${RUN_SEEDER:-false}"
    ports:
      - "${HOST_PORT:-8000}:80"
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./routes:/var/www/html/routes
      - senja_be_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - senja_be_network

  mysql:
    image: mysql:8.0
    container_name: senja-be-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-senja_be}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}"
      MYSQL_USER: "${DB_USERNAME:-senja}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - senja_be_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - senja_be_network

  redis:
    image: redis:7-alpine
    container_name: senja-be-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - senja_be_redis_data:/data
    networks:
      - senja_be_network

volumes:
  senja_be_storage:
    name: senja_be_storage
  senja_be_mysql_data:
    name: senja_be_mysql_data
  senja_be_redis_data:
    name: senja_be_redis_data

networks:
  senja_be_network:
    name: senja_be_network
    driver: bridge
