services:
  senja_be:
    build:
      context: .
      dockerfile: Dockerfile
    image: senja-be:latest
    container_name: senja-be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host-specific values so the app talks to the compose services.
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_SEEDER: "${RUN_SEEDER:-true}"
    ports:
      - "${HOST_PORT:-13053}:80"
    volumes:
      # Persist uploaded images and generated Passport keys across deploys.
      - senja_be_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - senja_be_network

  mysql:
    image: mysql:8.0
    container_name: senja-be-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-senja_be}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_USER: "${DB_USERNAME:-senja}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-senja}"
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - senja_be_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - senja_be_network

  redis:
    image: redis:7-alpine
    container_name: senja-be-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - senja_be_redis_data:/data
    networks:
      - senja_be_network

volumes:
  senja_be_storage:
    name: senja_be_storage
  senja_be_mysql_data:
    name: senja_be_mysql_data
  senja_be_redis_data:
    name: senja_be_redis_data

networks:
  senja_be_network:
    name: senja_be_network
    driver: bridge
