  /uploads:
    post:
      tags: [Uploads]
      summary: Upload an image
      description: 'Requires permission `uploads.create`. Max 5 MB; jpg, jpeg, png, webp, svg.'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Image stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      path:
                        type: string
                      url:
                        type: string
        '401':
          description: Unauthenticated.
        '403':
          description: Missing permission.
        '422':
          description: 'Validation error (wrong MIME type or exceeds size limit).'

