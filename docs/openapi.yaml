              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthenticated.
        '403':
          description: Missing permission.

  /contact-inquiries:
    post:
      tags: [Public Content]
      summary: Submit a contact inquiry from the landing page
      description: |
        Public endpoint, throttled to 30 requests per minute. Accepts snake_case or
        camelCase `projectType`. Sends a notification mail on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                company:
                  type: string
                  maxLength: 255
                phone:
                  type: string
                  maxLength: 50
                project_type:
                  type: string
                  maxLength: 255
                timeline:
                  type: string
                  maxLength: 255
                message:
                  type: string
                  maxLength: 10000
      responses:
        '201':
          description: Inquiry stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContactInquiry'
        '422':
          description: Validation error.
        '429':
          description: Too many submissions.
    get:
      tags: [CMS Admin]
      summary: List contact inquiries (paginated)
      description: 'Requires permission `contact-inquiries.view`.'
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            type: string
            enum: [new, read]
      responses:
        '200':
          description: List of inquiries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInquiries'
        '401':
          description: Unauthenticated.
        '403':
          description: Missing permission.

